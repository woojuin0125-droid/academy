<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎧 리파잉글리시 듣기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --ink:#1F2937; --sub:#6B7280; --line:#E5E7EB; --soft:#F3F4F6; --soft2:#E5E7EB;
    --green:#0D6952; --green-deep:#094E3D; --bad:#B42318;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none;
    touch-action:manipulation; overflow-x:hidden;
  }
  .app{max-width:760px; margin:0 auto; min-height:100%; padding:16px 24px 28px; display:flex; flex-direction:column;}
  .bar{display:flex; align-items:center; justify-content:space-between; min-height:40px; padding-bottom:12px; border-bottom:1px solid var(--line);}
  .logo{height:22px; width:auto; display:block;}
  .who{font-size:14px; color:var(--sub); display:flex; align-items:center; gap:12px;}
  .who #whoName{font-weight:700; color:var(--ink);}
  .who button{font:inherit; font-size:13px; font-weight:500; color:var(--sub); background:var(--soft); border:0; border-radius:10px; padding:9px 13px; cursor:pointer;}
  .who button:active{background:var(--soft2);}

  .screen{display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; padding:18px 0 12px;}
  .screen.on{display:flex; animation:rise .22s ease;}
  @keyframes rise{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:none;}}
  .head{display:flex; flex-direction:column; gap:6px; align-items:center;}
  h1{font-size:26px; margin:0; font-weight:700; letter-spacing:-.4px; line-height:1.3;}
  .sub{margin:0; color:var(--sub); font-size:15px; line-height:1.5;}
  .eyebrow{margin:0; font-size:15px; font-weight:700; color:var(--green);}

  /* 번호 입력 */
  .dots{display:flex; gap:10px; justify-content:center; margin:2px 0 14px;}
  .dots i{width:62px; height:74px; border-radius:14px; background:var(--soft); border:2px solid transparent; display:flex; align-items:center; justify-content:center; font:600 36px 'Space Grotesk',monospace; font-style:normal; color:var(--green);}
  .dots i.on{background:#fff; border-color:var(--green);}
  .keys{display:grid; grid-template-columns:repeat(3,96px); gap:10px; justify-content:center;}
  .keys button{height:64px; border-radius:16px; border:0; background:var(--soft); color:var(--ink); font:600 26px 'Space Grotesk',monospace; cursor:pointer; transition:background .08s;}
  .keys button:active{background:var(--soft2);}
  .keys button.fn{font:500 15px 'Noto Sans KR',sans-serif; color:var(--sub); background:transparent;}
  .keys button.fn:active{background:var(--soft);}
  .keys button.blank{visibility:hidden;}
  .keys.lock{opacity:.4; pointer-events:none;}
  .padmsg{min-height:22px; margin-top:12px; font-size:14px; font-weight:500; color:var(--sub);}
  .padmsg.err{color:var(--bad);}

  /* 책 */
  .cover{width:220px; height:220px; border-radius:16px; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; box-shadow:0 8px 24px rgba(17,24,39,.12); position:relative; background:#9CA3AF;}
  .cover img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
  .cover .t{font-weight:700; font-size:22px; line-height:1.25; padding:0 18px; position:relative; word-break:keep-all;}
  .cover .s{font-size:13px; opacity:.92; position:relative; margin-top:6px; font-weight:500;}
  .booktitle{font-size:22px; font-weight:700; margin:0; line-height:1.3; word-break:keep-all;}
  .tag{display:inline-block; font-size:13px; font-weight:500; padding:5px 12px; border-radius:99px; background:var(--soft); color:var(--sub);}

  /* 버튼 */
  .btns{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:4px;}
  .btn{font:inherit; font-size:17px; font-weight:700; border:0; border-radius:14px; padding:16px 28px; min-width:180px; cursor:pointer; background:var(--green); color:#fff; transition:background .1s;}
  .btn:active{background:var(--green-deep);}
  .btn.alt{background:var(--soft); color:var(--ink); font-weight:500;}
  .btn.alt:active{background:var(--soft2);}
  .linkbtn{font:inherit; font-size:14px; font-weight:500; color:var(--sub); background:none; border:0; padding:10px 14px; cursor:pointer;}
  .linkbtn:active{color:var(--ink);}
  .linkbtn.done{background:var(--green); color:#fff; border-radius:14px; padding:14px 30px; font-size:16px; font-weight:700;}
  .linkbtn.done:active{background:var(--green-deep); color:#fff;}

  /* 챕터 */
  .chlist{width:min(440px,90vw); display:flex; flex-direction:column; gap:8px; max-height:50vh; overflow:auto; padding:2px;}
  .chitem{display:flex; align-items:center; justify-content:space-between; font:inherit; font-size:17px; font-weight:700; border:0; border-radius:14px; padding:15px 18px; background:var(--soft); color:var(--ink); cursor:pointer; text-align:left;}
  .chitem:active{background:var(--soft2);}
  .chitem .st{font-size:13px; font-weight:500; color:var(--sub);}
  .chitem.done{background:#E7F3EF;} .chitem.done .st{color:var(--green); font-weight:700;}

  /* 받는 중 */
  .spin{width:40px; height:40px; border-radius:50%; border:4px solid var(--soft2); border-top-color:var(--green); animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .meter{width:min(380px,80vw); height:6px; background:var(--soft2); border-radius:99px; overflow:hidden;}
  .meter>i{display:block; height:100%; width:0; background:var(--green); border-radius:99px; transition:width .15s;}
  h2{font-size:19px; margin:0; font-weight:700;}
  .hint{font-size:13px; color:var(--sub);}

  /* 재생기 */
  .player{width:min(440px,86vw); display:flex; flex-direction:column; gap:8px;}
  .track{height:6px; background:var(--soft2); border-radius:99px; overflow:hidden;}
  .track>i{display:block; height:100%; width:0; background:var(--green); border-radius:99px;}
  .times{display:flex; justify-content:space-between; font:500 13px 'Space Grotesk',monospace; color:var(--sub);}
  .big{width:84px; height:84px; border-radius:50%; border:0; background:var(--green); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .1s, transform .08s;}
  .big:active{background:var(--green-deep); transform:scale(.96);}

  .okmark{width:72px; height:72px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; animation:pop .45s cubic-bezier(.2,1.5,.4,1);}
  @keyframes pop{from{transform:scale(.3); opacity:0;}to{transform:none; opacity:1;}}
  @media (prefers-reduced-motion:reduce){ .okmark,.screen.on{animation:none;} .spin{animation-duration:2.4s;} }

  #toast{position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:13px 20px; border-radius:12px; font-size:15px; font-weight:500; max-width:88vw; text-align:center; opacity:0; pointer-events:none; transition:opacity .2s; z-index:50;}
  #toast.on{opacity:1;}
</style>
</head>

    <p class="sub">다 들었어요. 기록되었어요.</p>
    <div class="btns">
      <button class="btn" id="btnOther2">다른 책 읽기</button>
      <button class="btn alt" id="btnEnd">끝내기</button>
    </div>
  </section>
</div>
<div id="toast"></div>

<script>
/* ============================================================
   설정
============================================================ */
var WORKER = window.__WORKER || 'https://academy-audio-worker.woojuin0125.workers.dev';
var IDLE_MS = window.__IDLE_MS || 150000;     // 듣지 않고 2분 30초 가만히 있으면 처음 화면으로
var SAVE_EVERY = window.__SAVE_EVERY || 20000; // 듣는 중 진행 저장 간격
var DONE_RATIO = 8/9;                         // 실제로 8/9(약 89%) 이상 들으면 "들었다" — 끝 1/9 남기고 나가도 인정 (아이들에게는 표시하지 않음)
var LEVEL_COLOR = {Pink:'#FF6FA0',Red:'#D62839',Orange:'#F77F3E',Yellow:'#EFB700',Green:'#2E9E63',Blue:'#3D7BC1',Purple:'#8354B4'};

function $(s){ return document.querySelector(s); }
function fmt(sec){ sec=Math.max(0,Math.floor(sec||0)); return Math.floor(sec/60)+':'+('0'+(sec%60)).slice(-2); }
function show(id){
  var all=document.querySelectorAll('.screen'); for(var i=0;i<all.length;i++) all[i].classList.remove('on');
  $(id).classList.add('on'); S.screen=id;
}
var toastT=null;
function toast(t,ms){ var el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){ el.classList.remove('on'); }, ms||3200); }

/* ============================================================
   상태
============================================================ */
var S = { token:'', sid:'', name:'', book:null, run:null, cp:null, nextCh:0, screen:'', busy:false, lastAct:Date.now() };
var ICON_PLAY='<svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true"><path fill="currentColor" d="M8.5 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L10 4.74a1 1 0 0 0-1.5.86z"/></svg>';
var ICON_PAUSE='<svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.3" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.3" fill="currentColor"/></svg>';
function setPlayIcon(isPlaying){ var b=$('#btnPlay'); b.innerHTML=isPlaying?ICON_PAUSE:ICON_PLAY; b.dataset.state=isPlaying?'pause':'play'; b.setAttribute('aria-label',isPlaying?'일시정지':'재생'); }
var A = null, audioUrl = '', playing = false, positioned = false, lastT = null, saveTimer = null;

/* ============================================================
   통신 (Worker) + 실패 시 기기 보관 후 재전송
============================================================ */
function api(path, opt){
  opt = opt || {};
  var h = {'Content-Type':'application/json'};
  if (S.token) h.Authorization = 'Bearer '+S.token;
  var o = {method:opt.method||'GET', headers:h}; if (opt.body) o.body = opt.body;
  return fetch(WORKER+path, o).then(function(r){
    return r.json().catch(function(){return null;}).then(function(j){
      if (r.status===401 && S.token){ forceLogout('다시 내 번호를 눌러 주세요'); }
      return {ok:r.ok, status:r.status, json:j};
    });
  }).catch(function(){ return {ok:false, status:0, json:null}; });
}
var QK = 'refy_listen_queue';
function qLoad(){ try{ return JSON.parse(localStorage.getItem(QK)||'[]'); }catch(e){ return []; } }
function qSave(a){ try{ localStorage.setItem(QK, JSON.stringify(a.slice(-200))); }catch(e){} }
function qPush(it){
  var a = qLoad().filter(function(x){
    if (x.sid!==it.sid || x.k!==it.k) return true;
    return it.k==='p' ? x.no!==it.no : x.id!==it.id;     // 같은 책 진행은 최신 것만, 같은 로그는 한 번만
  });
  a.push(it); qSave(a);
}
function sendItem(it){
  if (it.k==='p') return api('/api/progress/listen/'+it.no, {method:'PUT', body:JSON.stringify(it.body)});
  return api('/api/log/listen', {method:'POST', body:JSON.stringify(it.body)});
}
function qFlush(){
  if (!S.sid) return Promise.resolve();
  var a = qLoad(), rest = [], p = Promise.resolve();
  a.forEach(function(it){
    if (it.sid!==S.sid){ rest.push(it); return; }
    p = p.then(function(){ return sendItem(it); }).then(function(r){ if (!r.ok && (r.status===0 || r.status>=500)) rest.push(it); });
  });
  return p.then(function(){ qSave(rest); });
}
/* 결과: 'ok' 저장됨 / 'queued' 인터넷 문제로 기기에 보관(나중에 재전송) / 'rejected' 서버가 거절(설정·버전 문제) */
function sendOrQueue(it){
  return sendItem(it).then(function(r){
    if (r.ok) { if (qLoad().length) qFlush(); return 'ok'; }
    if (r.status===0 || r.status>=500){ qPush(it); return 'queued'; }
    if (r.status===401) return 'queued';
    return 'rejected';
  }).then(function(res){
    if (res==='rejected' && !S.warned){
      S.warned=true; toast('기록이 저장되지 않았어요. 선생님께 알려 주세요',6000);
      try{ console.error('기록 저장 거절', it.k, it.no||it.id); }catch(e){}
    }
    return res;
  });
}

/* ============================================================
   키패드
============================================================ */
function mkPad(rootSel, len, onDone){
  var root=$(rootSel), val='';
  root.innerHTML='<div class="dots"></div><div class="keys"></div><div class="padmsg" role="alert"></div>';
  var dots=root.querySelector('.dots'), keys=root.querySelector('.keys'), msg=root.querySelector('.padmsg');
  for (var i=0;i<len;i++) dots.appendChild(document.createElement('i'));
  function draw(){ var d=dots.children; for (var i=0;i<len;i++){ d[i].textContent = val[i] || ''; d[i].className = i===val.length?'on':''; } }
  function key(label, cls, fn){ var b=document.createElement('button'); b.type='button'; b.textContent=label; if(cls) b.className=cls; b.addEventListener('click', fn); keys.appendChild(b); }
  '123456789'.split('').forEach(function(n){ key(n,'',function(){ add(n); }); });
  key('지우기','fn',function(){ val=val.slice(0,-1); msg.textContent=''; draw(); });
  key('0','',function(){ add('0'); });
  key('','blank fn',function(){});
  function add(n){ if (val.length>=len) return; val+=n; msg.textContent=''; msg.className='padmsg'; draw(); if (val.length===len) onDone(val); }
  draw();
  return {
    clear:function(){ val=''; draw(); },
    msg:function(t,err){ msg.textContent=t||''; msg.className='padmsg'+(err?' err':''); },
    lock:function(on){ keys.classList.toggle('lock', !!on); }
  };
}
var pads = {};

/* ============================================================
   기기 안 음원 보관 (IndexedDB)  key = 번호_음원버전
============================================================ */
var memCache = {};
function idb(){
  return new Promise(function(res,rej){
    if (!window.indexedDB) return rej(new Error('no idb'));
    var r=indexedDB.open('refy_listen_audio',1);
    r.onupgradeneeded=function(){ r.result.createObjectStore('audio'); };
    r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); };
  });
}
function cacheGet(key){
  if (memCache[key]) return Promise.resolve(memCache[key]);
  return idb().then(function(db){ return new Promise(function(res){
    var q=db.transaction('audio').objectStore('audio').get(key);
    q.onsuccess=function(){ res(q.result||null); }; q.onerror=function(){ res(null); };
  }); }).catch(function(){ return null; });
}
function cachePut(prefix, key, blob){
  memCache[key]=blob;
  return idb().then(function(db){ return new Promise(function(res){
    var tx=db.transaction('audio','readwrite'), st=tx.objectStore('audio');
    st.put(blob,key);
    var c=st.openKeyCursor();                       // 같은 책의 옛 버전 삭제
    c.onsuccess=function(){ var cur=c.result; if(!cur) return; if(String(cur.key).indexOf(prefix)===0 && cur.key!==key) st.delete(cur.key); cur.continue(); };
    tx.oncomplete=function(){ res(); }; tx.onerror=function(){ res(); };
  }); }).catch(function(){});
}
function download(no, onProgress, ch){
  return fetch(WORKER+'/audio/'+no+(ch?'/'+ch:'')+'.mp3', {headers:{Authorization:'Bearer '+S.token}}).then(function(r){
    if (r.status===401){ forceLogout('다시 내 번호를 눌러 주세요'); throw new Error('auth'); }
    if (!r.ok) throw new Error('http'+r.status);
    var total=parseInt(r.headers.get('Content-Length')||'0',10);
    if (!r.body || !r.body.getReader) return r.blob();
    var rd=r.body.getReader(), parts=[], got=0;
    function pump(){ return rd.read().then(function(x){
      if (x.done) return new Blob(parts,{type:'audio/mpeg'});
      parts.push(x.value); got+=x.value.length; if (total) onProgress(got/total); return pump();
    }); }
    return pump();
  });
}

/* ============================================================
   화면 켜짐 유지
============================================================ */
var wl=null;
function lockScreen(){ try{ if ('wakeLock' in navigator && !wl){ navigator.wakeLock.request('screen').then(function(l){ wl=l; l.addEventListener('release',function(){ wl=null; }); }).catch(function(){}); } }catch(e){} }
function unlockScreen(){ try{ if (wl) wl.release(); }catch(e){} wl=null; }
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState==='visible'){ if (playing) lockScreen(); }
  else if (S.run && A) saveProgress(false);
});

/* ============================================================
   로그인 / 로그아웃
============================================================ */
function forceLogout(msg){ logout(msg); }
function logout(msg){
  if (S.run && A && S.screen==='#scrPlay') saveProgress(false);
  stopAudio(); S.token=''; S.sid=''; S.name=''; S.book=null; S.run=null; S.cp=null; S.warned=false;
  $('#who').style.display='none';
  pads.login.clear(); pads.login.msg(msg||'',!!msg); pads.login.lock(false);
  pads.book.clear(); pads.book.msg('');
  show('#scrLogin');
}
$('#btnLogout').addEventListener('click', function(){ logout(''); });

function doLogin(num){
  pads.login.lock(true); pads.login.msg('확인하는 중…');
  api('/auth',{method:'POST',body:JSON.stringify({number:num})}).then(function(r){
    pads.login.lock(false);
    if (!r.ok){
      pads.login.clear();
      pads.login.msg(r.status===401?'등록되지 않은 번호예요. 다시 눌러 보세요':r.status===429?'잠시 후에 다시 해 주세요':'인터넷 연결을 확인해 주세요', true);
      return;
    }
    S.token=r.json.token; S.sid=r.json.studentId; S.name=r.json.name||'';
    $('#whoName').textContent=S.name; $('#who').style.display='flex';
    try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    qFlush(); toBookEntry();
  });
}

/* ============================================================
   책 번호 → 확인 → 분기
============================================================ */
function toBookEntry(){
  stopAudio(); S.book=null; S.run=null; S.cp=null;
  $('#hello').textContent = (S.name ? S.name+'님, 안녕하세요' : '안녕하세요');
  pads.book.clear(); pads.book.msg(''); pads.book.lock(false);
  show('#scrBook');
}
function doBook(no){
  pads.book.lock(true); pads.book.msg('책을 찾는 중…');
  api('/api/book/'+no).then(function(r){
    pads.book.lock(false);
    if (!r.ok){
      pads.book.clear();
      pads.book.msg(r.status===404?'등록되지 않은 책 번호예요. 다시 눌러 보세요':'인터넷 연결을 확인해 주세요', true);
      return;
    }
    var b=r.json;
    if (!b.audio){ pads.book.clear(); pads.book.msg('"'+b.title+'"은(는) 아직 음원이 없어요', true); return; }
    S.book=b; showConfirm();
  });
}
var coverCache = {};      // 번호 → 표지 이미지 주소 (한 번만 받음)
function paintCover(el, b){
  el.innerHTML=''; el.style.background = LEVEL_COLOR[b.level] || '#9CA3AF';
  var t=document.createElement('div'); t.className='t'; t.textContent=b.title; el.appendChild(t);
  var s=document.createElement('div'); s.className='s'; s.textContent=b.stage?('Stage '+b.stage):(b.level||''); el.appendChild(s);
  if (!b.cover) return;
  function put(url){ var img=new Image(); img.alt=''; img.onload=function(){ if (S.book && S.book.no===b.no){ el.innerHTML=''; el.appendChild(img); } }; img.src=url; }
  if (coverCache[b.no]) return put(coverCache[b.no]);
  fetch(WORKER+'/cover/'+b.no+'.jpg',{headers:{Authorization:'Bearer '+S.token}}).then(function(r){ return r.ok?r.blob():null; }).then(function(bl){
    if (!bl) return; coverCache[b.no]=URL.createObjectURL(bl); put(coverCache[b.no]);
  }).catch(function(){});
}
function tagText(b){ return b.series==='ORT' ? ('ORT · Stage '+b.stage+' · 번호 '+b.no) : ((b.level?b.level+' · ':'')+'번호 '+b.no); }
function showConfirm(){
  var b=S.book;
  paintCover($('#cvConfirm'), b);
  $('#cfTitle').textContent=b.title; $('#cfTag').textContent=tagText(b);
  show('#scrConfirm');
}
$('#btnNo').addEventListener('click', toBookEntry);
$('#btnYes').addEventListener('click', function(){
  var b=S.book, p=b.progress;
  if (p && p.status==='completed'){
    $('#rrTitle').textContent=b.title;
    $('#rrSub').textContent='지금까지 '+(p.completedRuns||1)+'번 읽었어요. 다시 읽을까요?';
    show('#scrReread'); return;
  }
  if (isChap()){ initChapState(p); showChapters(); return; }
  if (p && p.status==='inProgress' && p.audioVer===b.audioVer && p.lastPosSec>=3){
    $('#rsTitle').textContent=b.title;
    $('#rsSub').textContent=fmt(p.lastPosSec)+' 까지 들었어요. 이어서 들을까요?';
    show('#scrResume'); return;
  }
  beginRun({ runNo:p ? (p.status==='inProgress' ? p.runNo : (p.completedRuns||0)+1) : 1,
             completedRuns:p ? (p.completedRuns||0) : 0, startPos:0, played:0 });
});
$('#btnReread').addEventListener('click', function(){
  var p=S.book.progress;
  if (isChap()){ S.cp={ runNo:(p.completedRuns||1)+1, completedRuns:(p.completedRuns||1), startedAt:Date.now(), chap:{}, curCh:1 }; showChapters(); return; }
  beginRun({ runNo:(p.completedRuns||1)+1, completedRuns:(p.completedRuns||1), startPos:0, played:0 });
});
$('#btnContinue').addEventListener('click', function(){
  var p=S.book.progress;
  beginRun({ runNo:p.runNo, completedRuns:p.completedRuns||0, startPos:Math.max(0,p.lastPosSec-2), played:p.playedSec||0, startedAt:p.startedAt });
});
$('#btnRestart').addEventListener('click', function(){
  var p=S.book.progress;
  beginRun({ runNo:p.runNo, completedRuns:p.completedRuns||0, startPos:0, played:0 });
});
$('#btnOther1').addEventListener('click', toBookEntry);
$('#btnOther2').addEventListener('click', toBookEntry);
$('#btnEnd').addEventListener('click', function(){ logout(''); });

/* ============================================================
   챕터북: 챕터 목록 → 챕터 듣기 → 다음 챕터 (모든 챕터를 들어야 책 한 권 완료)
============================================================ */
function isChap(){ return !!(S.book && S.book.chapters>=2); }
function initChapState(p){
  var b=S.book, inProg=!!(p && p.status==='inProgress'), same=inProg && p.audioVer===b.audioVer, chap={};
  if (inProg && p.chapters) Object.keys(p.chapters).forEach(function(k){
    var c=p.chapters[k]||{}; chap[k]={ done:c.done===true, playedSec:c.playedSec||0, lastPosSec: same ? (c.lastPosSec||0) : 0 };
  });
  S.cp={ runNo: p ? (inProg ? p.runNo : (p.completedRuns||0)+1) : 1, completedRuns: p ? (p.completedRuns||0) : 0,
         startedAt: (inProg && p.startedAt) || Date.now(), chap:chap, curCh: inProg ? (p.curCh||1) : 1 };
}
function cpDoneCount(){ var n=0; if(S.cp) for (var i=1;i<=S.book.chapters;i++) if (S.cp.chap[i] && S.cp.chap[i].done) n++; return n; }
function showChapters(){
  var b=S.book, list=$('#chList'); list.innerHTML='';
  $('#chTitle').textContent=b.title;
  for (var i=1;i<=b.chapters;i++){ (function(i){
    var c=S.cp.chap[i], el=document.createElement('button'); el.type='button';
    el.className='chitem'+(c&&c.done?' done':'');
    var st = c&&c.done ? '✓ 다 들었어요' : (c&&c.lastPosSec>=3 ? fmt(c.lastPosSec)+' 까지 · 이어서' : '');
    el.innerHTML='<span>'+i+'장</span><span class="st">'+st+'</span>';
    el.addEventListener('click', function(){ startChapter(i); });
    list.appendChild(el);
  })(i); }
  S.run=null; stopAudio(); show('#scrChapters');
}
function startChapter(ch){
  var c=S.cp.chap[ch], done=!!(c&&c.done);
  beginRun({ runNo:S.cp.runNo, completedRuns:S.cp.completedRuns, startedAt:S.cp.startedAt, ch:ch,
             startPos: (!done && c && c.lastPosSec>=3) ? Math.max(0,c.lastPosSec-2) : 0,
             played: (!done && c) ? (c.playedSec||0) : 0, done:done });
}
/* 지금 듣는 챕터의 상태를 S.cp에 반영 */
function cpSync(done){
  var r=S.run, c=S.cp; if (!r || !c || !r.ch) return;
  var cur=c.chap[r.ch] || {done:false, playedSec:0, lastPosSec:0};
  cur.done = cur.done || !!done || !!r.done;
  cur.playedSec = Math.round(r.played || cur.playedSec || 0);
  cur.lastPosSec = cur.done ? 0 : (A ? Math.round(A.currentTime*10)/10 : cur.lastPosSec);
  c.chap[r.ch]=cur; c.curCh=r.ch;
}
function chapBody(){
  var b=S.book, c=S.cp, r=S.run; cpSync(false);
  var all = cpDoneCount()>=b.chapters, sum=0, map={};
  Object.keys(c.chap).forEach(function(k){ var x=c.chap[k]; sum+=x.playedSec||0; map[k]={done:!!x.done, playedSec:x.playedSec||0, lastPosSec:x.lastPosSec||0}; });
  return { status: all?'completed':'inProgress', runNo:c.runNo, completedRuns: all?c.completedRuns+1:c.completedRuns,
           step:'listen', listenDone:all, playedSec:sum, lastPosSec:(map[r.ch]||{}).lastPosSec||0,
           audioVer:b.audioVer, startedAt:c.startedAt, chapters:map, curCh:r.ch };
}
function chapMarkDone(){
  var b=S.book, r=S.run, c=S.cp, sid=S.sid, dur=Math.round(A?A.duration||0:0);
  r.done=true; clearInterval(saveTimer); saveTimer=null; cpSync(true);
  var all=cpDoneCount()>=b.chapters;
  sendOrQueue({k:'p', sid:sid, no:b.no, body:chapBody()});
  var ev1={eventId:'listen_'+b.no+'_'+c.runNo+'_'+r.ch, type:'listen', bookNo:b.no, runNo:c.runNo, chapter:r.ch, stage:b.stage||0, playedSec:Math.round(r.played), durationSec:dur, completed:true};
  sendOrQueue({k:'l', sid:sid, id:ev1.eventId, body:ev1});
  if (all){   // 모든 챕터를 다 들었을 때만 "읽은 책" 기록
    var ev2={eventId:'run_'+b.no+'_'+c.runNo, type:'run', bookNo:b.no, runNo:c.runNo, stage:b.stage||0, reread:c.runNo>1, rounds:0, listenCompleted:true, followCompleted:false};
    sendOrQueue({k:'l', sid:sid, id:ev2.eventId, body:ev2});
  }
}
function showChapEnd(){
  var b=S.book, r=S.run, ch=r?r.ch:0; if (!b || !r) return;
  if (cpDoneCount()>=b.chapters){ S.cp=null; return showFinish(); }
  var next=0, i;
  for (i=ch+1;i<=b.chapters && !next;i++) if (!(S.cp.chap[i]&&S.cp.chap[i].done)) next=i;
  for (i=1;i<ch && !next;i++) if (!(S.cp.chap[i]&&S.cp.chap[i].done)) next=i;
  S.nextCh=next; stopAudio(); S.run=null;
  $('#ceHead').textContent=ch+'장을 다 들었어요'; $('#ceTitle').textContent=b.title;
  var nb=$('#btnNextCh'); nb.style.display=next?'':'none'; nb.textContent = next>ch ? '다음 챕터 듣기' : '안 들은 챕터 듣기';
  show('#scrChapEnd');
}
$('#btnNextCh').addEventListener('click', function(){ if (S.nextCh) startChapter(S.nextCh); });
$('#btnChList').addEventListener('click', showChapters);
$('#btnChOther').addEventListener('click', toBookEntry);
$('#btnChStop').addEventListener('click', function(){ logout(''); });

/* ============================================================
   음원 준비 → 듣기
============================================================ */
function beginRun(o){
  o.startedAt = o.startedAt || Date.now();
  S.run = o;
  var b=S.book, ch=o.ch||0, key=ch ? b.no+'_'+ch+'_'+b.audioVer : b.no+'_'+b.audioVer, prefix=ch ? b.no+'_'+ch+'_' : b.no+'_';
  S.busy=true; $('#prepBar').style.width='0'; $('#prepText').textContent='음원을 준비하고 있어요'; show('#scrPrep');
  cacheGet(key).then(function(blob){
    if (blob) return blob;
    $('#prepText').textContent='음원을 받고 있어요';
    return download(b.no, function(f){ $('#prepBar').style.width=Math.round(f*100)+'%'; }, ch).then(function(bl){
      $('#prepBar').style.width='100%'; return cachePut(prefix,key,bl).then(function(){ return bl; });
    });
  }).then(function(blob){
    S.busy=false; setupPlayer(blob);
  }).catch(function(e){
    S.busy=false;
    if (e && e.message==='auth') return;
    toast(e && e.message==='http404' ? '음원을 찾을 수 없어요. 선생님께 알려 주세요' : '음원을 받지 못했어요. 인터넷을 확인해 주세요', 4500);
    if (isChap() && S.cp) showChapters(); else toBookEntry();
  });
}
function stopAudio(){
  clearInterval(saveTimer); saveTimer=null; playing=false; unlockScreen();
  if (A){ try{ A.pause(); }catch(e){} A.removeAttribute('src'); try{ A.load(); }catch(e){} A=null; }
  if (audioUrl){ URL.revokeObjectURL(audioUrl); audioUrl=''; }
  document.body.classList.remove('playing'); $('#scrPlay').classList.remove('playing');
}
function setupPlayer(blob){
  stopAudio();
  var b=S.book;
  var a=A=new Audio(); a.preload='auto'; audioUrl=URL.createObjectURL(blob); a.src=audioUrl;
  function mine(fn){ return function(){ if (a===A) fn(); }; }      // 이미 닫은 재생기의 늦은 이벤트는 무시
  positioned=false; lastT=null;
  $('#plTitle').textContent=b.title; paintCover($('#cvPlay'), b);
  if (S.run.ch) $('#plTag').textContent = S.run.ch+'장 / 총 '+b.chapters+'장'+(S.run.runNo>1 ? ' · 다시 읽기 '+S.run.runNo+'번째' : '');
  else $('#plTag').textContent = S.run.runNo>1 ? ('다시 읽기 · '+S.run.runNo+'번째') : tagText(b);
  $('#plBar').style.width='0'; $('#plNow').textContent='0:00'; $('#plTotal').textContent=''; setPlayIcon(false);
  $('#plHint').textContent='끝까지 들으면 읽은 책으로 기록돼요';
  var st0=$('#btnStop'); st0.textContent='그만 듣기'; st0.className='linkbtn';
  a.addEventListener('loadedmetadata', mine(paintTime));
  a.addEventListener('timeupdate', mine(onTime));
  a.addEventListener('play', mine(onPlay));
  a.addEventListener('pause', mine(onPause));
  a.addEventListener('ended', mine(onEnded));
  a.addEventListener('error', mine(function(){ toast('음원을 재생할 수 없어요. 선생님께 알려 주세요',4500); }));
  show('#scrPlay');
}
function paintTime(){
  if (!A) return;
  var d=A.duration||0, t=A.currentTime||0;
  $('#plNow').textContent=fmt(t); $('#plTotal').textContent=d?fmt(d):'';
  $('#plBar').style.width=(d?Math.min(100,t/d*100):0)+'%';
}
function onTime(){
  var t=A.currentTime;
  if (lastT!==null && !A.paused){ var d=t-lastT; if (d>0 && d<1.5) S.run.played+=d; }   // 건너뛰기로는 누적되지 않음
  lastT=t; paintTime();
  var dur=A.duration||0;
  if (dur>0 && !S.run.done && S.run.played >= dur*DONE_RATIO) markDone();
}
function onPlay(){
  playing=true; lastT=A.currentTime; lockScreen();
  $('#scrPlay').classList.add('playing'); setPlayIcon(true);
  clearInterval(saveTimer); saveTimer=setInterval(function(){ saveProgress(false); }, SAVE_EVERY);
  if (!S.run.saved){ S.run.saved=true; saveProgress(false); }
}
function onPause(){
  if (A && A.ended) return;
  playing=false; unlockScreen(); clearInterval(saveTimer);
  $('#scrPlay').classList.remove('playing'); setPlayIcon(false);
  saveProgress(false);
}
$('#btnPlay').addEventListener('click', function(){
  if (!A) return;
  if (!A.paused){ A.pause(); return; }
  if (!positioned){
    positioned=true;
    var dur=A.duration||0, pos=S.run.startPos||0;
    if (dur && pos>dur-2) pos=0;
    try{ A.currentTime=pos; }catch(e){}
  }
  A.play().catch(function(){ toast('재생할 수 없어요. 다시 눌러 보세요'); });
});
$('#btnStop').addEventListener('click', function(){
  if (isChap() && S.run){
    if (A && !A.paused) A.pause();
    if (S.run.done){ showChapEnd(); return; }            // 이 챕터는 다 들음 → 다음 챕터 안내
    saveProgress(false); showChapters(); return;          // 중간에 그만둠: 위치만 저장하고 챕터 목록으로
  }
  if (S.run && S.run.done){ showFinish(); return; }        // 다 들은 뒤의 [끝내기]
  if (A && !A.paused) A.pause();
  saveProgress(false); toBookEntry();                       // 중간에 그만둠: 위치만 저장
});

function progressBody(done){
  if (isChap()) return chapBody();
  var b=S.book, r=S.run; done = done || !!r.done;
  return {
    status: done?'completed':'inProgress', runNo:r.runNo,
    completedRuns: done ? r.completedRuns+1 : r.completedRuns,
    step:'listen', listenDone: !!done, playedSec:Math.round(r.played),
    lastPosSec: done ? 0 : (A ? Math.round(A.currentTime*10)/10 : 0),
    audioVer:b.audioVer, startedAt:r.startedAt
  };
}
function saveProgress(done){
  if (!S.run || !S.book || !S.sid) return Promise.resolve('ok');
  return sendOrQueue({k:'p', sid:S.sid, no:S.book.no, body:progressBody(done)});
}
function onEnded(){
  playing=false; unlockScreen(); clearInterval(saveTimer);
  $('#scrPlay').classList.remove('playing'); setPlayIcon(false);
  var dur=A.duration||0;
  if (isChap()){
    if (S.run.done) return showChapEnd();
    if (S.run.played >= dur*DONE_RATIO){ markDone(); return showChapEnd(); }
  } else {
    if (S.run.done) return showFinish();
    if (S.run.played >= dur*DONE_RATIO){ markDone(); return showFinish(); }
  }
  // 건너뛰어서 끝에 온 경우: 인정하지 않고 처음부터
  toast('끝까지 잘 듣지 못했어요. 처음부터 다시 들어요',4500);
  S.run.played=0; S.run.startPos=0; positioned=false; lastT=null;
  try{ A.currentTime=0; }catch(e){}
  setPlayIcon(false); paintTime();
}
/* "다 들음" 기록: 8/9(약 89%)에 도달하는 순간 한 번만 저장 (끝나는 음악 전에 나가도 기록됨) */
function markDone(){
  var b=S.book, r=S.run; if (!r || r.done) return;
  if (isChap()) return chapMarkDone();
  r.done=true; clearInterval(saveTimer); saveTimer=null;
  var sid=S.sid, dur=Math.round(A?A.duration||0:0);
  var ev1={eventId:'listen_'+b.no+'_'+r.runNo, type:'listen', bookNo:b.no, runNo:r.runNo, stage:b.stage||0, playedSec:Math.round(r.played), durationSec:dur, completed:true};
  var ev2={eventId:'run_'+b.no+'_'+r.runNo, type:'run', bookNo:b.no, runNo:r.runNo, stage:b.stage||0, reread:r.runNo>1, rounds:0, listenCompleted:true, followCompleted:false};
  sendOrQueue({k:'p', sid:sid, no:b.no, body:progressBody(true)});
  sendOrQueue({k:'l', sid:sid, id:ev1.eventId, body:ev1});
  sendOrQueue({k:'l', sid:sid, id:ev2.eventId, body:ev2});
  // 화면에는 아무 표시도 하지 않음 (아이들이 알 수 없게). 기록만 조용히 저장.
}
function showFinish(){
  var b=S.book, r=S.run; if (!b || !r) return;
  $('#fnTitle').textContent=b.title;
  var tag=$('#fnTag'); if (r.runNo>1){ tag.textContent='재독 · '+r.runNo+'번째'; tag.style.display=''; } else tag.style.display='none';
  stopAudio(); S.run=null; S.book=null;
  show('#scrFinish');
}

/* ============================================================
   자리 비움 자동 로그아웃 (공용 패드 보호)
============================================================ */
['touchstart','click','keydown'].forEach(function(ev){ document.addEventListener(ev,function(){ S.lastAct=Date.now(); },true); });
setInterval(function(){
  if (!S.token || S.busy || playing) return;
  if (Date.now()-S.lastAct > IDLE_MS){ if (S.run && A) saveProgress(false); logout('쉬는 동안 처음 화면으로 돌아왔어요'); }
}, 5000);
window.addEventListener('online', function(){ qFlush(); });

/* ============================================================
   시작
============================================================ */
pads.login = mkPad('#padLogin', 4, doLogin);
pads.book  = mkPad('#padBook', 4, doBook);
show('#scrLogin');
</script>
</body>
</html>
